<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />

    <title>Flashcard Camera Search</title>

    <style>
      :root {
        --background: #f4f6fa;
        --surface: #ffffff;
        --text: #202533;
        --secondary: #687386;
        --primary: #3978e8;
        --border: #e0e5ed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      header {
        padding: 24px 18px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 23px;
      }

      .subtitle {
        color: var(--secondary);
        font-size: 14px;
      }

      main {
        max-width: 650px;
        margin: auto;
        padding: 18px;
      }

      .panel {
        padding: 16px;
        margin-bottom: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
      }

      #preview {
        display: none;
        width: 100%;
        max-height: 360px;
        object-fit: contain;
        border-radius: 10px;
        background: #171717;
      }

      .placeholder {
        padding: 38px 12px;
        color: var(--secondary);
        text-align: center;
        border: 2px dashed var(--border);
        border-radius: 10px;
      }

      .button {
        display: block;
        width: 100%;
        padding: 14px;
        margin-top: 12px;
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: white;
        font-size: 16px;
        font-weight: 650;
        text-align: center;
        cursor: pointer;
      }

      .button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .secondary-button {
        background: #e9effb;
        color: #2458b5;
      }

      #status {
        margin: 12px 0;
        color: var(--secondary);
        font-size: 14px;
        overflow-wrap: anywhere;
      }

      .recognized {
        padding: 12px;
        background: #f5f7fb;
        border-radius: 10px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .card {
        padding: 15px;
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: white;
      }

      .question {
        margin: 0 0 8px;
        font-size: 19px;
        overflow-wrap: anywhere;
      }

      .answer {
        margin: 0;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .meta {
        margin-top: 10px;
        color: var(--secondary);
        font-size: 12px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Flashcard Scanner</h1>
      <div class="subtitle">
        Scan a word and find its definition in your decks.
      </div>
    </header>

    <main>
      <section class="panel">
        <h2>1. Capture a word</h2>

        <div id="placeholder" class="placeholder">
          Take a clear photo of a word or a short passage.
        </div>

        <img id="preview" alt="Captured image preview" />

        <input
          id="imageInput"
          type="file"
          accept="image/*"
          capture="environment"
          class="hidden"
        />

        <button id="cameraButton" class="button">Open Camera</button>

        <button id="scanButton" class="button secondary-button" disabled>
          Recognize & Search
        </button>

        <div id="status" role="status" aria-live="polite">Ready to scan.</div>
      </section>

      <section id="resultsPanel" class="panel hidden">
        <h2>2. Search results</h2>

        <h3>Recognized text</h3>
        <div id="recognizedText" class="recognized"></div>

        <h3 id="matchHeading">Matching cards</h3>
        <div id="matches"></div>
      </section>
    </main>

    <script>
      const imageInput = document.getElementById("imageInput");
      const cameraButton = document.getElementById("cameraButton");
      const scanButton = document.getElementById("scanButton");
      const preview = document.getElementById("preview");
      const placeholder = document.getElementById("placeholder");
      const status = document.getElementById("status");
      const resultsPanel = document.getElementById("resultsPanel");
      const recognizedText = document.getElementById("recognizedText");
      const matchHeading = document.getElementById("matchHeading");
      const matchesContainer = document.getElementById("matches");

      let selectedFile = null;

      cameraButton.addEventListener("click", () => {
        imageInput.click();
      });

      imageInput.addEventListener("change", async () => {
        const file = imageInput.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
          status.textContent = "Please select an image.";
          return;
        }

        selectedFile = file;
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
        placeholder.style.display = "none";

        // Automatically run OCR immediately after capture.
        await scanImage();
      });

      async function scanImage() {
        if (!selectedFile) return;

        const formData = new FormData();
        formData.append("image", selectedFile);

        scanButton.disabled = true;
        cameraButton.disabled = true;
        status.textContent = "Recognizing text...";
        resultsPanel.classList.add("hidden");

        try {
          const response = await fetch("/api/scan", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "OCR failed.");
          }

          recognizedText.textContent = data.text || "No text detected.";

          matchesContainer.replaceChildren();

          const cards = data.matches || [];
          matchHeading.textContent = `Matching cards (${cards.length})`;

          if (cards.length === 0) {
            const message = document.createElement("p");
            message.textContent = data.message || "No matching cards found.";
            matchesContainer.appendChild(message);
          }

          for (const card of cards) {
            const item = document.createElement("article");
            item.className = "card";

            const question = document.createElement("h3");
            question.className = "question";
            question.textContent = card.question;

            const answer = document.createElement("p");
            answer.className = "answer";
            answer.textContent = card.answer || "No definition available.";

            const meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent = `Deck: ${card.deck}`;

            item.append(question, answer, meta);
            matchesContainer.appendChild(item);
          }

          resultsPanel.classList.remove("hidden");
          status.textContent = data.message || "Search complete.";
        } catch (error) {
          status.textContent = `Error: ${error.message}`;
        } finally {
          scanButton.disabled = false;
          cameraButton.disabled = false;
        }
      }

      scanButton.addEventListener("click", scanImage);
    </script>
  </body>
</html>
