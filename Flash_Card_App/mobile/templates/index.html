<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />

    <title>Flashcard Camera Search</title>

    <style>
      :root {
        --background: #f4f6fa;
        --surface: #ffffff;
        --text: #202533;
        --secondary: #687386;
        --primary: #3978e8;
        --border: #e0e5ed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }

      header {
        padding: 24px 18px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 23px;
      }

      .subtitle {
        color: var(--secondary);
        font-size: 14px;
      }

      main {
        max-width: 650px;
        margin: auto;
        padding: 18px;
      }

      .panel {
        padding: 16px;
        margin-bottom: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
      }

      #preview {
        display: none;
        width: 100%;
        max-height: 360px;
        object-fit: contain;
        border-radius: 10px;
        background: #171717;
      }

      .placeholder {
        padding: 38px 12px;
        color: var(--secondary);
        text-align: center;
        border: 2px dashed var(--border);
        border-radius: 10px;
      }

      .button {
        display: block;
        width: 100%;
        padding: 14px;
        margin-top: 12px;
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: white;
        font-size: 16px;
        font-weight: 650;
        text-align: center;
        cursor: pointer;
      }

      .button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .secondary-button {
        background: #e9effb;
        color: #2458b5;
      }

      .add-button {
        background: #198754;
      }

      #status,
      #lookupStatus {
        margin: 12px 0;
        color: var(--secondary);
        font-size: 14px;
        overflow-wrap: anywhere;
      }

      .recognized {
        padding: 12px;
        background: #f5f7fb;
        border-radius: 10px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.8;
        user-select: text;
      }

      .recognized::selection {
        background: #a8c7fa;
      }

      .card {
        padding: 22px;
        margin-top: 18px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: white;
        cursor: pointer;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .card.expanded { padding: 26px; }
      .card-topline { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:12px; }
      .pronunciation { color:var(--secondary); font-size:15px; }
      .part-of-speech { padding:4px 9px; border:1px solid var(--border); border-radius:7px; color:var(--secondary); font-size:13px; }
      .card-content-grid { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(220px,1fr); gap:20px; }
      .card-column { min-width:0; }
      .detail-value { line-height:1.7; font-size:15px; overflow-wrap:anywhere; }
      .detail-list { margin:0; padding-left:22px; line-height:1.8; }
      .example-box { padding:14px 16px; background:#f5f7fb; border-left:4px solid var(--primary); border-radius:8px; line-height:1.7; }
      .example-translation { margin-top:7px; color:var(--secondary); }
      .mistake-list { padding:12px 16px; background:#fff8ed; border-radius:9px; line-height:1.7; }
      @media (max-width:600px) {
        .card, .card.expanded { padding:18px; }
        .card-content-grid { grid-template-columns:1fr; gap:4px; }
        .image-grid { grid-template-columns:1fr; }
        .image-item img { max-height:260px; }
      }

      .card:hover {
        border-color: #c5d0e0;
        box-shadow: 0 2px 8px rgba(32, 37, 51, 0.06);
      }

      .card.expanded {
        border-color: var(--primary);
        box-shadow: 0 2px 12px rgba(57, 120, 232, 0.12);
      }

      .question {
        margin: 0 0 8px;
        font-size: 19px;
        overflow-wrap: anywhere;
      }

      .answer {
        margin: 0;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .meta {
        margin-top: 10px;
        color: var(--secondary);
        font-size: 12px;
      }

      .expand-hint {
        margin-top: 10px;
        color: var(--primary);
        font-size: 13px;
        font-weight: 500;
      }

      .card.expanded .expand-hint {
        display: none;
      }

      .card-details {
        display: none;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }

      .card.expanded .card-details {
        display: block;
      }

      .details-section {
        margin-bottom: 14px;
      }

      .details-section:last-child {
        margin-bottom: 0;
      }

      .details-section h4 {
        margin: 0 0 8px;
        font-size: 14px;
        color: var(--secondary);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .link-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .link-list li {
        margin-bottom: 6px;
      }

      .link-list a {
        color: var(--primary);
        text-decoration: none;
        font-size: 15px;
        line-height: 1.4;
      }

      .link-list a:hover {
        text-decoration: underline;
      }

      .image-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .image-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .image-item img {
        width: 100%;
        max-height: 160px;
        object-fit: contain;
        border-radius: 8px;
        background: #f0f2f5;
        border: 1px solid var(--border);
        cursor: zoom-in;
        -webkit-tap-highlight-color: transparent;
      }

      .image-item .image-title {
        font-size: 12px;
        color: var(--secondary);
        line-height: 1.3;
      }

      /* Fullscreen image lightbox (mobile) */
      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.92);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        padding-top: max(16px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        -webkit-tap-highlight-color: transparent;
      }

      .lightbox.open {
        display: flex;
      }

      .lightbox-close {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        right: 12px;
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
        z-index: 1001;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .lightbox-img {
        max-width: 100%;
        max-height: calc(100vh - 100px);
        object-fit: contain;
        border-radius: 8px;
        touch-action: manipulation;
      }

      .lightbox-caption {
        margin-top: 12px;
        color: rgba(255, 255, 255, 0.85);
        font-size: 14px;
        text-align: center;
        max-width: 90%;
        line-height: 1.4;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      select {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: white;
        font-size: 15px;
      }

      .hidden {
        display: none;
      }

      .definition-row {
        margin: 12px 0;
        line-height: 1.55;
      }

      .definition-row strong {
        display: block;
        margin-bottom: 4px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Flashcard Scanner</h1>
      <div class="subtitle">
        Scan words and find their definitions in your decks.
      </div>
    </header>

    <main>
      <section class="panel">
        <h2>Target Deck</h2>

        <label for="targetDeck"> Add new words to: </label>

        <select id="targetDeck">
          <option value="">Loading decks...</option>
        </select>
      </section>

      <section class="panel">
        <h2>1. Capture a word</h2>

        <div id="placeholder" class="placeholder">
          Take a clear photo of a word or a short passage.
        </div>

        <img id="preview" alt="Captured image preview" />

        <input
          id="imageInput"
          type="file"
          accept="image/*"
          capture="environment"
          class="hidden"
        />

        <button id="cameraButton" class="button">Open Camera</button>

        <button id="scanButton" class="button secondary-button" disabled>
          Recognize & Search
        </button>

        <div id="status" role="status" aria-live="polite">Ready to scan.</div>
      </section>

      <section id="resultsPanel" class="panel hidden">
        <h2>2. Search results</h2>

        <h3>Recognized text</h3>

        <p class="meta">Highlight any single word to look up its definition.</p>

        <div id="recognizedText" class="recognized"></div>

        <h3 id="matchHeading">Matching cards</h3>

        <div id="matches"></div>
      </section>

      <section id="dictionaryPanel" class="panel hidden">
        <h2>3. Word definition</h2>

        <div id="dictionaryContent"></div>

        <div id="lookupStatus" role="status"></div>

        <button id="addButton" class="button add-button hidden">
          Add to Deck
        </button>
      </section>
    </main>

    <!-- Single fullscreen image lightbox -->
    <div
      id="lightbox"
      class="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Image preview"
    >
      <button
        type="button"
        id="lightboxClose"
        class="lightbox-close"
        aria-label="Close"
      >
        ×
      </button>
      <img id="lightboxImg" class="lightbox-img" alt="" />
      <div id="lightboxCaption" class="lightbox-caption"></div>
    </div>

    <script>
      const imageInput = document.getElementById("imageInput");
      const cameraButton = document.getElementById("cameraButton");
      const scanButton = document.getElementById("scanButton");
      const preview = document.getElementById("preview");
      const placeholder = document.getElementById("placeholder");

      const status = document.getElementById("status");

      const resultsPanel = document.getElementById("resultsPanel");
      const recognizedText = document.getElementById("recognizedText");
      const matchHeading = document.getElementById("matchHeading");
      const matchesContainer = document.getElementById("matches");

      const targetDeck = document.getElementById("targetDeck");

      const dictionaryPanel = document.getElementById("dictionaryPanel");
      const dictionaryContent = document.getElementById("dictionaryContent");
      const lookupStatus = document.getElementById("lookupStatus");
      const addButton = document.getElementById("addButton");

      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightboxImg");
      const lightboxCaption = document.getElementById("lightboxCaption");
      const lightboxClose = document.getElementById("lightboxClose");

      let selectedFile = null;
      let currentDefinition = null;
      let currentLookupToken = 0;

      // --------------------------------
      // LOAD DECKS
      // --------------------------------

      async function loadDecks() {
        targetDeck.replaceChildren();

        try {
          const response = await fetch("/api/decks");
          const responseText = await response.text();

          let decks;

          try {
            decks = JSON.parse(responseText);
          } catch {
            throw new Error(
              `Server returned HTML or invalid JSON. HTTP ${response.status}: ` +
                responseText.substring(0, 200),
            );
          }

          if (!response.ok) {
            throw new Error(decks.error || "Cannot load decks.");
          }

          if (!Array.isArray(decks)) {
            throw new Error(decks.error || "Invalid deck response.");
          }

          if (decks.length === 0) {
            targetDeck.add(new Option("No decks available", ""));
            return;
          }

          decks.forEach((deck) => {
            targetDeck.add(new Option(deck.name, deck.id));
          });
        } catch (error) {
          targetDeck.add(new Option("Failed to load decks", ""));
          console.error("Deck loading error:", error);
          status.textContent = error.message;
        }
      }

      loadDecks();

      // --------------------------------
      // CAMERA
      // --------------------------------

      cameraButton.addEventListener("click", () => {
        imageInput.click();
      });

      imageInput.addEventListener("change", async () => {
        const file = imageInput.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
          status.textContent = "Please select an image.";
          return;
        }

        selectedFile = file;

        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
        placeholder.style.display = "none";

        await scanImage();
      });

      // --------------------------------
      // OCR
      // --------------------------------

      async function scanImage() {
        if (!selectedFile) return;

        const formData = new FormData();
        formData.append("image", selectedFile);

        scanButton.disabled = true;
        cameraButton.disabled = true;

        status.textContent = "Recognizing text...";
        resultsPanel.classList.add("hidden");
        dictionaryPanel.classList.add("hidden");

        try {
          const response = await fetch("/api/scan", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "OCR failed.");
          }

          const text = data.text || (data.recognized_text || []).join("\n");

          recognizedText.textContent = text || "No text detected.";
          matchesContainer.replaceChildren();

          const cards = data.matches || [];
          matchHeading.textContent = `Matching cards (${cards.length})`;

          if (cards.length === 0) {
            const message = document.createElement("p");
            message.textContent = data.message || "No matching cards found.";
            matchesContainer.appendChild(message);
          }

          for (const card of cards) {
            matchesContainer.appendChild(createMatchCard(card));
          }

          resultsPanel.classList.remove("hidden");
          status.textContent =
            "Search complete. Highlight a word to look it up.";
        } catch (error) {
          status.textContent = `Error: ${error.message}`;
        } finally {
          scanButton.disabled = false;
          cameraButton.disabled = false;
        }
      }

      scanButton.addEventListener("click", scanImage);

      // --------------------------------
      // IMAGE LIGHTBOX (mobile)
      // --------------------------------

      function openLightbox(url, title) {
        lightboxImg.src = url;
        lightboxImg.alt = title || "Expanded image";
        lightboxCaption.textContent = title || "";
        lightbox.classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        lightbox.classList.remove("open");
        lightboxImg.src = "";
        lightboxCaption.textContent = "";
        document.body.style.overflow = "";
      }

      lightboxClose.addEventListener("click", (e) => {
        e.stopPropagation();
        closeLightbox();
      });

      // Tap backdrop or the large image to close
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox || e.target === lightboxImg) {
          closeLightbox();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && lightbox.classList.contains("open")) {
          closeLightbox();
        }
      });

      // --------------------------------
      // CREATE EXPANDABLE MATCH CARD
      // --------------------------------

      function createMatchCard(card) {
        const item = document.createElement("article");
        item.className = "card";
        item.setAttribute("role", "button");
        item.setAttribute("tabindex", "0");
        item.setAttribute("aria-expanded", "false");

        const section = (parent, title, value) => {
          if (value == null || value === "") return;
          const wrap = document.createElement("section");
          wrap.className = "details-section";
          const heading = document.createElement("h4");
          heading.textContent = title;
          const body = document.createElement("div");
          body.className = "detail-value";

          if (Array.isArray(value)) {
            const list = document.createElement("ul");
            list.className = "detail-list";
            value.forEach((entry) => {
              const li = document.createElement("li");
              li.textContent = entry;
              list.appendChild(li);
            });
            body.appendChild(list);
          } else {
            body.textContent = value;
          }
          wrap.append(heading, body);
          parent.appendChild(wrap);
        };

        const top = document.createElement("div");
        top.className = "card-topline";
        if (card.pronunciation) {
          const ipa = document.createElement("span");
          ipa.className = "pronunciation";
          ipa.textContent = card.pronunciation;
          top.appendChild(ipa);
        }
        if (card.part_of_speech) {
          const pos = document.createElement("span");
          pos.className = "part-of-speech";
          pos.textContent = card.part_of_speech;
          top.appendChild(pos);
        }

        const question = document.createElement("h3");
        question.className = "question";
        question.textContent = card.question || card.name || "Untitled";

        const answer = document.createElement("p");
        answer.className = "answer";
        answer.style.cssText = "font-size:18px;font-weight:650";
        answer.textContent = card.answer || "No translation available.";

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `Category: ${card.category || "General"} • Deck: ${card.deck || "Unknown"}`;

        const hint = document.createElement("div");
        hint.className = "expand-hint";
        hint.textContent = "Tap to view full details";
        item.append(top, question, answer, meta, hint);

        const details = document.createElement("div");
        details.className = "card-details";
        const grid = document.createElement("div");
        grid.className = "card-content-grid";
        const left = document.createElement("div");
        left.className = "card-column";
        const right = document.createElement("div");
        right.className = "card-column";

        section(left, "Definition", card.definition);

        if (card.example && typeof card.example === "object") {
          const wrap = document.createElement("section");
          wrap.className = "details-section";
          const heading = document.createElement("h4");
          heading.textContent = "Example";
          const box = document.createElement("div");
          box.className = "example-box";
          const exampleText = document.createElement("div");
          exampleText.textContent = card.example.text || "No example available.";
          box.appendChild(exampleText);
          if (card.example.translation) {
            const translation = document.createElement("div");
            translation.className = "example-translation";
            translation.textContent = card.example.translation;
            box.appendChild(translation);
          }
          wrap.append(heading, box);
          left.appendChild(wrap);
        } else {
          section(left, "Example", card.example);
        }

        section(left, "How it works", card.how_it_works);
        section(right, "Applications", card.applications);
        section(right, "Related terms", card.related_terms);
        section(right, "Common mistakes", card.common_mistakes);
        grid.append(left, right);
        details.appendChild(grid);

        const images = Array.isArray(card.images) ? card.images : [];
        if (images.length) {
          const wrap = document.createElement("section");
          wrap.className = "details-section";
          const heading = document.createElement("h4");
          heading.textContent = "Images";
          const imageGrid = document.createElement("div");
          imageGrid.className = "image-grid";
          images.forEach((image) => {
            if (!image || !image.url) return;
            const imageItem = document.createElement("div");
            imageItem.className = "image-item";
            const img = document.createElement("img");
            img.src = image.url;
            img.alt = image.title || "Flashcard illustration";
            img.loading = "lazy";
            img.addEventListener("click", (e) => {
              e.stopPropagation();
              openLightbox(image.url, image.title || "");
            });
            imageItem.appendChild(img);
            if (image.title) {
              const title = document.createElement("div");
              title.className = "image-title";
              title.textContent = image.title;
              imageItem.appendChild(title);
            }
            imageGrid.appendChild(imageItem);
          });
          wrap.append(heading, imageGrid);
          details.appendChild(wrap);
        }

        const links = Array.isArray(card.links) ? card.links : [];
        if (links.length) {
          const wrap = document.createElement("section");
          wrap.className = "details-section";
          const heading = document.createElement("h4");
          heading.textContent = "References & links";
          const list = document.createElement("ul");
          list.className = "link-list";
          links.forEach((link) => {
            if (!link || !link.url) return;
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = link.url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = link.title || link.url;
            a.addEventListener("click", (e) => e.stopPropagation());
            li.appendChild(a);
            list.appendChild(li);
          });
          wrap.append(heading, list);
          details.appendChild(wrap);
        }

        item.appendChild(details);
        const toggle = () => {
          const expanded = item.classList.toggle("expanded");
          item.setAttribute("aria-expanded", String(expanded));
        };
        item.addEventListener("click", toggle);
        item.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });
        return item;
      }

      // --------------------------------
      // SELECT WORD FROM OCR TEXT
      // --------------------------------

      recognizedText.addEventListener("mouseup", handleWordSelection);
      recognizedText.addEventListener("touchend", () => {
        setTimeout(handleWordSelection, 100);
      });

      async function handleWordSelection() {
        const selection = window.getSelection();
        const word = selection.toString().trim();

        if (!word || /\s/.test(word)) return;

        const cleanWord = word.replace(/^[^a-zA-Z0-9]+|[^a-zA-Z0-9]+$/g, "");
        if (!cleanWord) return;

        await lookupWord(cleanWord);
      }

      // --------------------------------
      // DICTIONARY LOOKUP
      // --------------------------------

      async function lookupWord(word) {
        const lookupToken = ++currentLookupToken;

        currentDefinition = null;
        dictionaryPanel.classList.remove("hidden");
        dictionaryContent.replaceChildren();
        lookupStatus.textContent = `Looking up "${word}"...`;
        addButton.classList.add("hidden");
        addButton.disabled = false;

        try {
          const response = await fetch(
            `/api/lookup?word=${encodeURIComponent(word)}`,
          );
          const data = await response.json();

          if (lookupToken !== currentLookupToken) return;

          if (!response.ok) {
            throw new Error(data.error || "Word not found.");
          }

          dictionaryContent.replaceChildren();

          if (data.exists) {
            const card = data.card;
            dictionaryContent.append(
              createElement("h3", card.question || card.name),
              createDefinitionRow("Definition", card.answer || card.definition),
              createDefinitionRow("Deck", card.deck || "Existing card"),
            );
            lookupStatus.textContent =
              "This word already exists in your decks.";
            addButton.classList.add("hidden");
            return;
          }

          const definition = data.definition;
          currentDefinition = definition;

          dictionaryContent.append(
            createElement("h3", definition.word),
            createDefinitionRow(
              "Vietnamese translation",
              definition.translation,
            ),
          );

          lookupStatus.textContent =
            "Word not found in your decks. You can add it below.";
          addButton.classList.remove("hidden");
        } catch (error) {
          if (lookupToken !== currentLookupToken) return;
          lookupStatus.textContent = error.message;
        }
      }

      // --------------------------------
      // HELPERS
      // --------------------------------

      function createElement(tag, text) {
        const element = document.createElement(tag);
        element.textContent = text || "Not available";
        return element;
      }

      function createDefinitionRow(label, value) {
        const container = document.createElement("div");
        container.className = "definition-row";

        const title = document.createElement("strong");
        title.textContent = label;

        const content = document.createElement("div");
        content.textContent = value || "Not available";

        container.append(title, content);
        return container;
      }

      // --------------------------------
      // ADD WORD TO SELECTED DECK
      // --------------------------------

      addButton.addEventListener("click", async () => {
        const definition = currentDefinition;
        const lookupToken = currentLookupToken;

        if (!definition) return;

        const deckId = targetDeck.value.trim();

        if (!deckId) {
          lookupStatus.textContent = "Please select a deck first.";
          return;
        }

        addButton.disabled = true;
        lookupStatus.textContent = `Adding "${definition.word}"...`;

        try {
          const response = await fetch("/api/add-card", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              deck_id: deckId,
              word: definition.word,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Failed to add card.");
          }

          if (currentLookupToken !== lookupToken) return;

          lookupStatus.textContent = `Successfully added "${data.word}" to "${data.deck}".`;

          if (currentDefinition === definition) {
            currentDefinition = null;
            addButton.classList.add("hidden");
          }
        } catch (error) {
          if (currentLookupToken === lookupToken) {
            lookupStatus.textContent = error.message;
          }
        } finally {
          if (
            currentLookupToken === lookupToken &&
            currentDefinition === definition
          ) {
            addButton.disabled = false;
          }
        }
      });
    </script>
  </body>
</html>
